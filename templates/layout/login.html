<!DOCTYPE html>
<html lang="en">
  <head>
    {{> common/head.private }}
  </head>
  <body class="bg-success min-vh-100">
    <main class="min-vh-100 d-flex align-items-center py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-6 col-lg-4 col-xl-3">

            <div class="text-center mb-4">
              <a href="/" aria-label="Zur Startseite">
                <img
                  src="assets/svg/organ-logo-black.svg"
                  alt="Logo der Orgenfreunde Plauen"
                  class="img-fluid"
                  style="max-width: 160px;"
                >
              </a>
            </div>

            <form action="/organcms" method="post" class="card shadow border-0">
              <div class="card-body p-4">
                <h1 class="h4 text-center mb-4">Login</h1>

                <div class="mb-3">
                  <label for="username" class="form-label">Login</label>
                  <input 
                    type="text"
                    name="username"
                    class="form-control"
                    id="username"
                    autocomplete="username"
                    autofocus
                    required
                  >
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Passwort</label>
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    id="password"
                    autocomplete="current-password"
                    required
                  >
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Einloggen
                </button>
              </div>
            </form>

            <a href="/" class="btn btn-secondary mt-3 w-100">
              Zurück zur Hauptseite
            </a>

          </div>
        </div>
      </div>
    </main>
  </body>
</html>
